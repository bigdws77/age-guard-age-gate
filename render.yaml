# render.yaml — Age Guard: Age Gate
# Deploy this via Render Dashboard: New > Blueprint

services:
  - type: web
    name: age-guard-age-gate
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: write_metaobject_definitions,write_metaobjects,write_products
      - key: SHOPIFY_APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: age-guard-db
          property: connectionString

databases:
  - name: age-guard-db
    databaseName: ageguard
    region: oregon
    plan: free
    postgresMajorVersion: '16'
